# OpenOCD config for the MSPM0G3507 (copied to obj/openocd.cfg by the build
# for the VS Code Cortex-Debug launch). Needs an OpenOCD build that includes
# TI's MSPM0 support (target/ti/mspm0.cfg). With an XDS110 (LP-MSPM0G3507)
# use interface/xds110.cfg instead of CMSIS-DAP.
source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/ti/mspm0.cfg]
